# Unprivileged nginx main configuration for the Servicer web tier.
#
# deploy/web.yaml sets runAsNonRoot: true, so this image runs as uid/gid 101
# (the base image's nginx user) instead of root. The stock nginx.conf cannot be
# used as-is because:
#   * its `user nginx;` directive only works for a super-user master process and
#     is rejected noisily otherwise, and
#   * it writes the PID file to /var/run/nginx.pid, which is root-owned.
# PID and temp files therefore live in directories writable by uid 101. The
# server config itself is generated by the image entrypoint from
# /etc/nginx/templates/default.conf.template into /etc/nginx/conf.d.

worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Created by the image build and owned by uid/gid 101.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
