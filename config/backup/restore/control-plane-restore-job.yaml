apiVersion: batch/v1
kind: Job
metadata:
  name: servicer-control-plane-restore
  namespace: servicer-system
  labels:
    app.kubernetes.io/name: servicer
    app.kubernetes.io/component: restore
  annotations:
    servicer.io/backup-path: /backups/servicer-YYYYMMDD-HHMMSS
spec:
  # Manual, opt-in Job. The base install does not include it: render it with
  # bash hack/render-control-plane-restore.sh <backup-path> so BACKUP_PATH points
  # at a real backup directory on the servicer-control-plane-backups PVC.
  template:
    spec:
      serviceAccountName: servicer-control-plane-backup
      restartPolicy: Never
      containers:
        - name: restore
          image: ghcr.io/sindef/servicer-tools:v0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BACKUP_PATH
              value: /backups/servicer-YYYYMMDD-HHMMSS
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -d "${BACKUP_PATH:-}" ]; then
                echo "BACKUP_PATH is unset or is not a backup directory on the PVC: ${BACKUP_PATH:-<unset>}" >&2
                echo "Render this Job with bash hack/render-control-plane-restore.sh <backup-path> before applying it." >&2
                exit 1
              fi
              /workspace/hack/control-plane-backup.sh restore "$BACKUP_PATH"
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: servicer-control-plane-backups
