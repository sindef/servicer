name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Daily at 02:00 UTC — catches secrets landed in older commits
    - cron: "0 2 * * *"

jobs:
  gitleaks:
    name: Gitleaks credential scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the commits of a pull request, which needs an
    # explicit read grant: the default token is read-only for repository
    # contents and returns 403 "Resource not accessible by integration".
    permissions:
      # Gitleaks lists pull request commits to scan only the changed range,
      # which needs pull-requests read on top of the default contents read.
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Full history needed for scheduled full-repo scans
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

