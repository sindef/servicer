name: Upgrade E2E

on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Previous released Servicer version
        required: false
        default: v0.1.0

jobs:
  upgrade:
    name: KinD upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
        with:
          version: v1.32.2

      - name: Set up KinD
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
        with:
          install_only: true

      - name: Run upgrade e2e
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: ./hack/e2e-upgrade.sh
