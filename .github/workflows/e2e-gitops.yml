name: GitOps E2E

# Proves the GitOps delivery path end to end on a KinD cluster: the manager
# publishes the ServiceInstance artifact into a Git remote, creates the Argo CD
# Application that consumes it, and hack/e2e-gitops.sh asserts the published
# commit and the rendered source path.
#
# The script needs go (it runs the delivery-repo and controller suites and
# starts cmd/manager), kubectl, git and a live KinD cluster.
#
# Triggers:
#   * schedule: nightly run against the default branch
#   * pull_request to release/**: release pull requests exercise GitOps delivery
#     before a release tag exists
#   * workflow_dispatch: on demand
#   * workflow_call: tag-release gate in .github/workflows/build.yml, where the
#     release jobs depend on this run
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "51 3 * * *"
  pull_request:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  gitops:
    name: KinD GitOps delivery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: go.sum

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: v1.32.2

      - name: Set up KinD
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2
        with:
          install_only: true

      - name: Run GitOps e2e
        run: ./hack/e2e-gitops.sh
