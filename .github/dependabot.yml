version: 2

# This repository is hosted on GitHub and already uses Dependabot, so Dependabot
# stays the dependency-update tool (no Renovate configuration is added).
#
# Noise control:
#   - every ecosystem is checked once a week
#   - minor and patch bumps for one ecosystem land in a single grouped pull request
#   - each ecosystem keeps at most 5 open pull requests
#
# Security updates are not grouped here: Dependabot opens them as separate,
# immediate pull requests outside this schedule. The groups below therefore
# apply to version updates only.
updates:
  # Go module (operator, BFF and sync tooling).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend build tooling and runtime packages.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions pinned in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base images in Containerfile.* and docker-compose.demo.yml.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
